<app-spinner></app-spinner>
<div class="container" *ngIf="isLogged">
  <div class="row">
    <div class="col-6">
      <div class="titulos">Registro de Guardias</div>
    </div>
    <div class="col-6 m mt-3 d-flex justify-content-end">
      <button mat-fab class="button-primary" matTooltip="Volver atrás" routerLink="/home-page">
        <mat-icon>keyboard_arrow_left</mat-icon>
      </button>
    </div>
  </div>

  <div class="row mt-4">
    <div class="col-md-6 text-center">
      <button 
        class="btn btn-success btn-lg btn-block" 
        routerLink="/registro-actividades-ingreso"
        
      >
        <mat-icon>login</mat-icon> Registrar Entrada
      </button>
    </div>
    <div class="col-md-6 text-center">
      <button 
        class="btn btn-danger btn-lg btn-block" 
        routerLink="/registro-actividades-egreso"
      >
        <mat-icon>logout</mat-icon> Registrar Salida
      </button>
    </div>
  </div>

</div>
