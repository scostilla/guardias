<h1 mat-dialog-title>DETALLE
  <h5>SERVICIO</h5>
</h1>
<mat-dialog-content>
  <table class="table">
    <tbody>
      <tr>
        <th scope="row">Descripción</th>
        <td>{{ servicio.descripcion }}</td>
      </tr>
      <tr>
        <th scope="row">Nivel</th>
        <td>{{ servicio.nivel }}</td>
      </tr>
      <tr>
        <th scope="row">Crítico</th>
        <td>{{ servicio.critico ? 'Sí' : 'No' }}</td>
      </tr>

      <tr>
        <th scope="row">Efectores</th>
        <td>
          <ng-container *ngIf="servicio.efectores?.length; else sinEfectores">
            <ul style="margin: 0; padding-left: 18px;">
              <li *ngFor="let e of servicio.efectores">
                {{ e?.nombre || ('ID ' + e?.id) }}
              </li>
            </ul>
          </ng-container>

          <ng-template #sinEfectores>
            <span>Sin efectores</span>
          </ng-template>
        </td>
      </tr>
    </tbody>
  </table>

  <div mat-dialog-actions class="action mt-4">
    <button mat-raised-button color="primary" type="button" (click)="cerrar()">Cerrar</button>
  </div>
</mat-dialog-content>
