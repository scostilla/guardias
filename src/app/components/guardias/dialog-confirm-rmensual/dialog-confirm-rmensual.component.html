<h1 mat-dialog-title>Confirmación de pase:</h1>
<div mat-dialog-content>
    <p class="negrita">¿Estás seguro que deseas crear la declaración jurada de todos los servicios y enviarla para su revisión por el director del hospital?</p>
    <p class="btnRemove">Esta acción no podrá deshacerse.</p>
</div>
<div mat-dialog-actions class="center-content">
    <button mat-raised-button (click)="cancelar()">Cancelar</button>
    <button mat-raised-button color="primary" (click)="confirmar()" cdkFocusInitial>Confirmar</button>
</div>
