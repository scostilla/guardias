<h2 mat-dialog-title>Historial de observaciones</h2>
<mat-dialog-content>
  <table mat-table [dataSource]="dataSource" class="mat-elevation-z2" *ngIf="dataSource">

<ng-container matColumnDef="fecha">
  <th mat-header-cell *matHeaderCellDef>Fecha observación</th>
  <td mat-cell *matCellDef="let obs">
    {{ obs.fechaCreacion | date: 'dd/MM/yyyy' }} {{ obs.horaCreacion }}
  </td>
</ng-container>

<ng-container matColumnDef="usuario">
  <th mat-header-cell *matHeaderCellDef>Realiza observación</th>
  <td mat-cell *matCellDef="let obs">
    {{ obs.nombreUsuario }} {{ obs.apellidoUsuario }}
  </td>
</ng-container>

<ng-container matColumnDef="mensaje">
  <th mat-header-cell *matHeaderCellDef>Observación</th>
  <td mat-cell *matCellDef="let obs">{{ obs.motivo }}</td>
</ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cerrar</button>
</mat-dialog-actions>
