<h1 mat-dialog-title>DETALLE AUTORIDAD:
</h1>

  <mat-dialog-content>
    <table class="table">
        <tbody>
          <tr class="bg-light">
            <th scope="row">Apellido y nombre</th>
            <td>{{autoridad.persona!.apellido}}, {{autoridad.persona!.nombre}}</td>
          </tr>    
        </tbody>
      </table>
    <div mat-dialog-actions class="action mt-4">
        <button mat-raised-button color="primary" type="button" mat-button (click)="cerrar()">Cerrar</button>
    </div>
  </mat-dialog-content>
