<app-spinner></app-spinner>
<div class="container">
  <div class="row">
    <div class="col-12 col-md-6 col-sm-12">
      <div class="titulos_extra">PERSONAL SIN LEGAJO</div>
    </div>
    <div class="col-12 col-md-2 col-sm-12 m d-flex justify-content-end">
      <button mat-fab class="button-success" (click)="createAsistencial()" matTooltip="Agregar Persona Asistencial">
        <mat-icon>library_add</mat-icon>
      </button>
      <button mat-fab color="accent" style="margin-left: 5px;" (click)="createNoAsistencial()" matTooltip="Agregar Persona No Asistencial">
        <mat-icon>library_add</mat-icon>
      </button>
      <button mat-fab class="button-primary" matTooltip="Volver atrás" style="margin-left: 5px;" (click)="goBack()">
        <mat-icon>keyboard_arrow_left</mat-icon>
      </button>
    </div>
    <div class="col-12 col-md-4 mt-3 mt-md-0 col-sm-12">
      <mat-form-field>
        <mat-label>Filtro</mat-label>
        <input matInput placeholder="Buscar por nombre, apellido o cuil" (keyup)="applyFilter($event)" #input>
      </mat-form-field>
    </div>
  </div>

  <div class="row">
    <div class="row">
      <div class="col-12 col-md-6">Estás viendo:
        <button mat-button [matMenuTriggerFor]="menug" style="font-weight: bold;">Personal sin legajo asignado 
          <mat-icon>expand_more</mat-icon></button>
        <mat-menu #menug="matMenu">
          <button mat-menu-item routerLink="/personal">Ver <span class="negrita">Asistenciales</span></button>
          <button mat-menu-item routerLink="/personal-no-asistencial">Ver <span class="negrita">No asistenciales</span></button>
          <button mat-menu-item routerLink="//personal-externo">Ver <span class="negrita">Externo (Extra y contrafactura)</span></button>
          <button mat-menu-item routerLink="/personal-autoridad-list">Ver <span class="negrita">Autoridades</span></button>
        </mat-menu>
      </div>

      <div class="col-12 col-md-6 m d-flex justify-content-md-end">
      </div>

    </div>
    
    <div *ngIf="sinSinLegajoMessage" class="no-selection-message">
      No se encontraron personas sin legajo asignado, haz 
      <button class="button-primary" (click)="goBack()">clic aquí</button> para regresar atrás.
    </div>
    
    <div *ngIf="!sinSinLegajoMessage">

    <div class="table-responsive">
      <table mat-table [dataSource]="dataSource" matSort #empTbSort="matSort" class="mat-elevation-z6"> 

        <ng-container matColumnDef="nombre">
          <th mat-header-cell *matHeaderCellDef mat-sort-header class="negrita"> Nombre </th>
          <td mat-cell *matCellDef="let row">{{ row.nombre }}</td>
        </ng-container>
      
        <ng-container matColumnDef="apellido">
          <th mat-header-cell *matHeaderCellDef mat-sort-header class="negrita"> Apellido </th>
          <td mat-cell *matCellDef="let row">{{ row.apellido }}</td>
        </ng-container>
      
        <ng-container matColumnDef="cuil">
          <th mat-header-cell *matHeaderCellDef mat-sort-header class="negrita"> CUIL </th>
          <td mat-cell *matCellDef="let row" style="white-space: nowrap;">{{ formatCuil(row.cuil) }}</td>
        </ng-container>
      
        <ng-container matColumnDef="tipo">
          <th mat-header-cell *matHeaderCellDef mat-sort-header class="negrita"> Tipo </th>
          <td mat-cell *matCellDef="let row">{{ row.tipo }}</td>
        </ng-container>

        <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef class="negrita"></th>
          <td mat-cell *matCellDef="let row" class="cell-actions">
            <button mat-icon-button matTooltip="Ver {{row.nombre}}" (click)="openDetail(row)">
              <mat-icon class="btnDetail" style="transform: rotate(90deg)">zoom_in</mat-icon>
            </button>
            <button mat-icon-button matTooltip="Editar {{row.nombre}}" (click)="updateAsistencial(row)">
              <mat-icon class="btnEdit">edit</mat-icon>
            </button>
            <button mat-icon-button matTooltip="Eliminar {{row.nombre}}" (click)="deleteAsistencial(row)">
              <mat-icon class="btnRemove">delete</mat-icon>
            </button>
            <button mat-icon-button matTooltip="Agregar legajo" (click)="crearLegajo(row)">
              <mat-icon color="primary">playlist_add</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>
  </div>

  <div class="row mt-3">
    <div class="col-lg-9">        
      <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" showFirstLastButtons></mat-paginator>
    </div>
  </div>

</div>
