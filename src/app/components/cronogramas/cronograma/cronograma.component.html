<app-spinner></app-spinner>
<div class="container">
  <div class="row">
    <div class="col-md-6 d-flex justify-content-md-start justify-content-center">
        <div class="titulos">Cronograma <span class="titulos-second">Tentativo</span></div>
    </div>
    <div class="col-md-6 d-flex justify-content-md-end justify-content-center align-items-start mt-3 mt-md-0">
      <mat-button-toggle-group name="tipocalendario" aria-label="tipo calendario">
        <mat-button-toggle value="tentativo" disabled>Tentativo</mat-button-toggle>
        <mat-button-toggle value="definitivo" routerLink="/cronograma-def">Definitivo</mat-button-toggle>
        <!--<mat-button-toggle value="regional" routerLink="/cronograma-reg">Regional</mat-button-toggle>-->
      </mat-button-toggle-group>
    </div>
  </div>
  <div class="row mt-3 mt-md-0"> 
    <div class="col-12 col-md-6 d-flex justify-content-center justify-content-md-start"><!--
      <button mat-button [matMenuTriggerFor]="menug" style="font-weight: bold;">Guardias Activas</button>
      <mat-menu #menug="matMenu">
        <button mat-menu-item routerLink="/cronograma-p">Guardias Pasivas</button>
      </mat-menu>-->
    </div>
    <div class="col-12 col-md-6 d-flex justify-content-center justify-content-md-end">
      <div class="col-12 col-md-6 m d-flex justify-content-center justify-content-md-end">
        <button mat-button [matMenuTriggerFor]="menu"> » {{ getServicioNombreSeleccionado() }}</button>
        <mat-menu #menu="matMenu">
          <!-- "Todos los servicios" selecciona null para quitar el filtro -->
          <button mat-menu-item (click)="onServicioSelect(null)">Todos los servicios</button>
    
          <!-- Lista de servicios -->
          <button mat-menu-item *ngFor="let servicio of servicios" (click)="onServicioSelect(servicio.id)">
            {{ servicio.descripcion }}
          </button>
        </mat-menu>
      </div>
    </div>
  </div>
  <div class="row mb-3"> 
    <div class="col-12 d-flex justify-content-center titulo-calendario">{{ viewDate | date: 'MMMM yyyy' | uppercase }}</div>
    <div class="col-12 d-flex justify-content-center" style="margin-top: -30px;">Efector: <span class="negrita ps-1">{{efectorNombre}}</span></div>
  </div>
  <div class="row d-float justify-content-center">
    <div class="col-12 d-flex justify-content-center">
      <div class="ref-contenedor"><span class="ref-circulo circulo--extra"></span>&nbsp;<span class="ref ref-extra">Extra</span></div>
      <div class="ref-contenedor"><span class="ref-circulo circulo--cargo"></span>&nbsp;<span class="ref ref-cargo">Cargo</span></div>
      <div class="ref-contenedor"><span class="ref-circulo circulo--agrupacion"></span>&nbsp;<span class="ref ref-agrupacion">Agrupación</span></div>
      <div class="ref-contenedor"><span class="ref-circulo circulo--contrafactura"></span>&nbsp;<span class="ref ref-contrafactura">Contrafactura</span></div>
    </div>
  </div>

  <div class="row">
    <div class="col-6 d-flex justify-content-start">
      <button mat-icon-button color="primary" (click)="openCronogramaDialog()" matTooltip="Añadir Profesional">
        <mat-icon>library_add</mat-icon>
      </button>
      <button mat-icon-button (click)="exportarCalendarioPDF()" matTooltip="Exportar PDF"
      [disabled]="view !== CalendarView.Month"
      [class.btn-disabled]="view !== CalendarView.Month">
        <mat-icon [class.btnEdit]="view === CalendarView.Month">picture_as_pdf</mat-icon>
      </button>
    </div>
    <div class="col-6 d-flex justify-content-end">
      <button mat-icon-button (click)="previousView()" matTooltip="Anterior">
        <mat-icon>navigate_before</mat-icon>
      </button>
      <button mat-icon-button (click)="currentView()" matTooltip="Fecha actual">
        <mat-icon>today</mat-icon>
      </button>
      <button mat-icon-button (click)="nextView()" matTooltip="Próximo">
        <mat-icon>navigate_next</mat-icon>
      </button>
      <button mat-icon-button color="accent" (click)="changeView(CalendarView.Month)" matTooltip="Ver mes">
        <mat-icon>calendar_today</mat-icon>
      </button>
      <button mat-icon-button color="accent" (click)="changeView(CalendarView.Week)" matTooltip="Ver semana">
        <mat-icon>view_week</mat-icon>
      </button>
      <!--<button mat-icon-button color="accent" (click)="changeView(CalendarView.Day)" matTooltip="Ver día">
        <mat-icon>calendar_view_day</mat-icon>
      </button>-->
    </div>
  </div>
  <div class="row"> 

    <!-- CALENDARIO DE MES -->
    <mwl-calendar-month-view
      *ngIf="view === CalendarView.Month"
      [viewDate]="viewDate"
      [events]="events"
      [weekendDays]="[0, 6]"
      (dayClicked)="dayClicked($event.day)"
      (beforeViewRender)="beforeMonthViewRender($event)"
      [refresh]="refresh"
      [eventTitleTemplate]="eventTemplate"
      [cellTemplate]="cellTemplate" 
    >
    </mwl-calendar-month-view>

    <!-- TEMPLATE PERSONALIZADO PARA LAS CELDAS DEL MES -->
    <ng-template #cellTemplate let-day="day">
      <div class="cal-cell-top">
        <span class="cal-day-number">{{ day.date | date:'d' }}</span>
      </div>
      
      <div class="event-list">
        <div
          *ngFor="let event of day.events"
          class="event-item"
          [ngStyle]="{
            'background-color': event.color?.primary || '#ccc',
            'border-color': event.color?.secondary || '#999'
          }"
          [matTooltip]="event.title"
          (click)="$event.stopPropagation(); onMonthEventClicked(event)"
        >
          <!-- Apellido del profesional con tachado si es rechazado -->
          <span [ngStyle]="{
            textDecoration: event.auth === 'RECHAZADO' ? 'line-through' : 'none'
          }">
            {{ getApellidoFromEvent(event) }}
          </span>

          <!-- Icono según el estado usando tu método -->
          <span
            *ngIf="event.auth === 'PENDIENTE' || event.auth === 'RECHAZADO'"
            [ngStyle]="{
              color: event.auth === 'PENDIENTE' ? 'orange' : 'red',
              fontWeight: 'bold',
              marginLeft: '4px'
            }"
          >
            {{ getIconoAutorizacion(event.auth) }}
          </span>
        </div>
      </div>
    </ng-template>


    <!-- CALENDARIO DE SEMANA -->
    <ng-template #eventTemplate let-event="event">
      <div
        class="event-bar"
        [ngStyle]="{ 'background-color': event.color?.primary || '#ccc' }"
        matTooltip="{{ event.title }}"
      >
        {{ event.title.split(',')[0] }}
      </div>
    </ng-template>

    <mwl-calendar-week-view
      *ngIf="view === CalendarView.Week"
      [viewDate]="viewDate"
      [events]="events"
      (eventClicked)="onEventClicked($event)"
      (beforeViewRender)="beforeWeekViewRender($event)">
    </mwl-calendar-week-view>


    <!--<mwl-calendar-day-view
    *ngIf="view === CalendarView.Day"
    [viewDate]="viewDate"
    [events]="events"
    (beforeViewRender)="beforeDayViewRender($event)">
  </mwl-calendar-day-view>-->
  </div>
</div>
